name: CI

# NOTE: CI resolves SpeechKit from GitHub at the version pinned in Package.swift
# (2.0.0 or later, which ships the `SpeechServiceExtensionKey` seam this package
# stores its transcriber through). Local development can point at a sibling
# checkout with SPEECHKIT_VOZ_USE_LOCAL_SPEECHKIT=1 (see Package.swift).

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Xcode 26.x is the Swift 6.2-family toolchain for this package.
  XCODE_VERSION: "26.2"
  # Treats SpeechKitVoz's own warnings as errors without applying the flag to
  # desert-ant-core, which Xcode builds with `-suppress-warnings`.
  SPEECHKIT_VOZ_STRICT_WARNINGS: "1"

jobs:
  swift-package:
    name: SwiftPM macOS build/test
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Toolchain versions
        run: |
          xcodebuild -version
          xcode-select -p
          swift --version

      - name: Build with warnings as errors
        run: swift build -Xswiftc -warnings-as-errors

      - name: Test with warnings as errors
        run: swift test -Xswiftc -warnings-as-errors

      - name: Build package documentation
        run: |
          mkdir -p '${{ runner.temp }}/SymbolGraphs' '${{ runner.temp }}/SpeechKitVozSymbolGraphs' '${{ runner.temp }}/ClangModuleCache'
          # `-emit-extension-block-symbols` records the `SpeechService` extension
          # this package adds, so DocC can link those members.
          CLANG_MODULE_CACHE_PATH='${{ runner.temp }}/ClangModuleCache' swift build \
            --target SpeechKitVoz \
            -Xswiftc -warnings-as-errors \
            -Xswiftc -emit-symbol-graph \
            -Xswiftc -emit-symbol-graph-dir \
            -Xswiftc '${{ runner.temp }}/SymbolGraphs' \
            -Xswiftc -emit-extension-block-symbols
          # SpeechKit and desert-ant-core also emit graphs. This catalog
          # documents only SpeechKitVoz and its extensions.
          cp '${{ runner.temp }}/SymbolGraphs'/SpeechKitVoz*.symbols.json '${{ runner.temp }}/SpeechKitVozSymbolGraphs/'
          xcrun docc convert Sources/SpeechKitVoz/SpeechKitVoz.docc \
            --additional-symbol-graph-dir '${{ runner.temp }}/SpeechKitVozSymbolGraphs' \
            --output-dir '${{ runner.temp }}/SpeechKitVoz.doccarchive' \
            --fallback-display-name SpeechKitVoz \
            --fallback-bundle-identifier com.sentinelite.SpeechKitVoz \
            --fallback-bundle-version 1.0.0 \
            --warnings-as-errors

  platform-build:
    name: ${{ matrix.name }} build
    runs-on: macos-26

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            destination: platform=macOS
            derived-data: macos
          - name: iOS
            destination: generic/platform=iOS
            derived-data: ios
          - name: visionOS
            destination: generic/platform=visionOS
            derived-data: visionos
          # VOZ is excluded on watchOS. This build proves the `#if !os(watchOS)`
          # guards hold, so a multi-platform app can depend on the package from
          # every target.
          - name: watchOS
            destination: generic/platform=watchOS
            derived-data: watchos

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Toolchain versions
        run: |
          xcodebuild -version
          xcode-select -p
          swift --version

      # `OTHER_SWIFT_FLAGS=-warnings-as-errors` is deliberately absent: xcodebuild
      # applies it to every package in the graph, and it conflicts with the
      # `-suppress-warnings` Xcode gives dependency targets. SPEECHKIT_VOZ_STRICT_WARNINGS
      # scopes the same strictness to SpeechKitVoz's own sources.
      - name: Build ${{ matrix.name }}
        run: |
          xcodebuild build \
            -scheme SpeechKitVoz \
            -destination '${{ matrix.destination }}' \
            -derivedDataPath '${{ runner.temp }}/DerivedData/${{ matrix.derived-data }}' \
            CODE_SIGNING_ALLOWED=NO
